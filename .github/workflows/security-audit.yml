name: security-audit

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit pytest
      - name: Run unit tests (security + core)
        run: pytest tests/ -q --ignore=tests/test_run.py
      - name: pip-audit
        run: pip-audit -r requirements.txt || true
        # Informational until pins are fully locked; do not fail the build on advisories yet.
